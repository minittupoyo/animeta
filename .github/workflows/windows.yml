name: Windows build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - name: Install cross-build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-pc-windows-msvc
          cargo install cargo-xwin --version 0.23.1 --locked
      - run: bun run tauri build --runner cargo-xwin --target x86_64-pc-windows-msvc --no-bundle
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: animeta-windows-x64
          path: src-tauri/target/x86_64-pc-windows-msvc/release/animeta.exe
          if-no-files-found: error
          retention-days: 14
